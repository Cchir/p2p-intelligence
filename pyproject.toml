[project]
name = "p2p-intelligence"
version = "1.0.0"
description = "Process mining, compliance analytics and advanced modelling on a real SAP purchase-to-pay event log."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Stratum", email = "stratumfreelance@gmail.com" }]
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "lxml>=5.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "lifelines>=0.29",
    "plotly>=5.24",
    "streamlit>=1.39",
    "requests>=2.32",
    "dbt-duckdb>=1.8",
    "numpyro>=0.15",
    "jax>=0.4.30",
    "torch>=2.3",
    "pm4py>=2.7.23.12",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "jupytext>=1.16", "nbclient>=0.10", "ipykernel>=6.29", "nbformat>=5.10", "matplotlib>=3.9", "seaborn>=0.13"]

[project.scripts]
p2p = "p2p.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p2p"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 165
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"dashboard/*" = ["E501"]
"notebooks/*" = ["E501", "B018", "UP031"]
